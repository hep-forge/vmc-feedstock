{% set versions = {
    "2.2": "6da6a32352c5a3eb62d07aed92414a0baf2793f6ec0630402e3df7fcb1b73d7b"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}
{% set root_tag = (root or '')|replace('.', '') %}

{% set name = environ.get('ANACONDA_PACKAGE', 'vmc')|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  url: "https://github.com/vmc-project/vmc/archive/refs/tags/v{{ version|replace('.', '-') }}.tar.gz"
  {% if versions.get(version, None) %}
  sha256: {{ versions.get(version) }}
  {% endif %}

build:
  number: 0
  string: "root{{ root_tag }}"
  skip: true  # [not linux]
  # ROOT_GENERATE_DICTIONARY() installs lib/*.pcm, which conda-build's
  # prefix relocation would corrupt.
  ignore_prefix_files:
    - lib/*.pcm
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    - root_base {{ root }}.* cxx{{ root_cxx_standard }}*
    - python
  run:
    - {{ pin_compatible('root_base', exact=True) }}

test:
  commands:
    - test -f "${PREFIX}/lib/libVMCLibrary.so"
    - test -f "${PREFIX}/include/vmc/TVirtualMC.h"
    - test -f "${PREFIX}/lib/VMC-{{ version }}.0/VMCConfig.cmake"
    - root -l -b -q -e 'gSystem->Load("libVMCLibrary"); if (!TClass::GetClass("TVirtualMC")) exit(1);'

about:
  home: https://vmc-project.github.io/
  dev_url: https://github.com/vmc-project/vmc
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Virtual Monte Carlo interface for ROOT
  description: |
    The Virtual Monte Carlo (VMC) is an abstract C++ interface to Monte
    Carlo transport codes (Geant3, Geant4, FLUKA), so the same user code
    runs with any of them. This is the standalone build, linked against
    hep-forge ROOT.

extra:
  recipe-maintainers:
    - meiyasan
